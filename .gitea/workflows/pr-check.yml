name: PR checks
on:
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: cat7
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore dependency downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.cache/app-ci
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/env.sh', '**/Cargo.lock', '**/package-lock.json', '**/uv.lock') }}
      - name: Prepare pinned tools and caches
        run: bash scripts/setup.sh
      - name: Check formatting
        run: bash scripts/format.sh
      - name: Lint
        run: bash scripts/lint.sh

  build-dev:
    runs-on: cat7
    needs: checks
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7
      - name: Restore development tools and dependency downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.rustup/toolchains
            ~/.cache/app-ci
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/env.sh', '**/Cargo.lock', '**/package-lock.json', '**/uv.lock') }}
      - name: Prepare pinned tools and caches
        run: bash scripts/setup.sh
      - name: Test native development executables
        run: bash scripts/test.sh
      - name: Build native development targets
        run: bash scripts/build.sh
